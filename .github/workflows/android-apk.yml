name: Build Android APK

on:
  push:
    branches: [main, native-fcm-notifications]
    tags: ['fbchat-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure stable Android signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/fbchat-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          {
            echo "FBCHAT_SIGNING_KEYSTORE=$KEYSTORE"
            echo "FBCHAT_SIGNING_STORE_PASSWORD=$ANDROID_SIGNING_STORE_PASSWORD"
            echo "FBCHAT_SIGNING_KEY_ALIAS=$ANDROID_SIGNING_KEY_ALIAS"
            echo "FBCHAT_SIGNING_KEY_PASSWORD=$ANDROID_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Compile and package APK
        run: gradle --no-daemon --project-dir android assembleDebug

      - name: Validate APK package metadata and signature
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | grep -E "package: name='com.codingbotlab.fbchat'|application-label:'FB Chat'"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fb-chat-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned APK for in-app updates
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          VERSION="$(grep -E "versionName '" android/app/build.gradle | head -n 1 | sed -E "s/.*versionName '([^']+)'.*/\1/")"
          test -n "$VERSION"
          TAG="fbchat-v$VERSION"
          RELEASE_APK="$RUNNER_TEMP/fbchat-$VERSION.apk"
          cp "$APK" "$RELEASE_APK"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --clobber --repo "$GITHUB_REPOSITORY"
            gh release delete-asset "$TAG" app-debug.apk --yes --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            gh release edit "$TAG" --title "FB Chat $VERSION" --notes "Signed Android update for FB Chat $VERSION. Installation is confirmed by Android; stable signing is used for future updates." --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RELEASE_APK" --title "FB Chat $VERSION" --notes "Signed Android update for FB Chat $VERSION. Installation is confirmed by Android; stable signing is used for future updates." --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
