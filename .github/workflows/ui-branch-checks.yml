name: UI branch checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [ui/bootstrap-icons-alerts]

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Automated tests
        run: npm test
