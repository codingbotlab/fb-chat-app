plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def stableKeystorePath = System.getenv("FBCHAT_SIGNING_KEYSTORE")
def stableStorePassword = System.getenv("FBCHAT_SIGNING_STORE_PASSWORD")
def stableKeyAlias = System.getenv("FBCHAT_SIGNING_KEY_ALIAS")
def stableKeyPassword = System.getenv("FBCHAT_SIGNING_KEY_PASSWORD")

android {
    namespace 'com.codingbotlab.fbchat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.codingbotlab.fbchat'
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName '1.3.4'
    }

    if (stableKeystorePath && stableStorePassword && stableKeyAlias && stableKeyPassword) {
        signingConfigs {
            stableRelease {
                storeFile file(stableKeystorePath)
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
            if (stableKeystorePath && stableStorePassword && stableKeyAlias && stableKeyPassword) {
                signingConfig signingConfigs.stableRelease
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.2.0'
    implementation 'io.socket:socket.io-client:2.1.0'
}
