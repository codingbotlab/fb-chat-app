plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codingbotlab.fbchat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.codingbotlab.fbchat'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
